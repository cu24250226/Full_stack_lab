<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbus | Checkout</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="store-extras.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">Namocart<span>.</span></div>
    <nav class="navbar">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="product.html">Products</a></li>
        <li><a href="cart.html">Cart <span id="cart-badge" class="cart-badge">0</span></a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="checkout-section">
      <h1>Checkout</h1>

      <div id="confirmation-msg" class="confirmation"></div>

      <form id="checkout-form" class="checkout-form" action="#" method="post" novalidate>

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name">
          <div id="name-error" class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="address">Address</label>
          <input type="text" id="address" name="address" placeholder="House no., street, area">
          <div id="address-error" class="field-error"></div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="City">
          </div>

          <div class="form-group">
            <label for="pincode">Pincode</label>
            <input type="text" id="pincode" name="pincode" placeholder="6-digit pincode" maxlength="6" inputmode="numeric">
            <div id="pincode-error" class="field-error"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" maxlength="10" inputmode="numeric">
          <div id="phone-error" class="field-error"></div>
        </div>

        <div class="form-group">
          <label>Payment Method</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="payment" value="cod" checked>
              Cash on Delivery
            </label>
            <label class="radio-option">
              <input type="radio" name="payment" value="card">
              Credit / Debit Card
            </label>
            <label class="radio-option">
              <input type="radio" name="payment" value="upi">
              UPI
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-large">Place Order</button>

      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p>Contact us: support@namocart.com | +91 98765 43210</p>
      <p>&copy; 2026 Namocart. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
